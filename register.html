<div class="container-register">
  <h4 class="text-center sub-title" >
    ! Registrate ahora !
  </h4>

  <div
    class="container-form"
    style="width: 50%; justify-content: center; margin: auto"
  >
    <input type="text" placeholder="Nombre" />
    <input type="text" placeholder="Apellido" />
    <input type="text" placeholder="Correo electrónico" />
    <input type="password" placeholder="Contraseña" />
    <input type="password" placeholder="Confirmar contraseña" />
    <input type="number" placeholder="Ingresa tu número" />
    <button class="button-primary">Registrar</button>
    <span class="text-center" style="color: white"
      >¿ Ya tienes una cuenta ?</span
    >
    <span
      class="text-center"
      style="color: white"
      onclick="loadPage('./login.html')"
      >Inicia sesión aqui</span
    >
  </div>
</div>
